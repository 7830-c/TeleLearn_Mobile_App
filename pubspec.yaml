name: telelearn
description: "TeleLearn - Standalone High-Performance Video Learning App with YouTube-style Streaming"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.2
  crypto: ^3.0.3
  open_filex: ^4.5.0
  tg: ^0.0.20
  t: ^229.0.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
